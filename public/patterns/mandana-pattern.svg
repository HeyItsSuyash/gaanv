<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Mandana Traditional Rajasthani Folk Floor Art Motif with earthy brown strokes -->
  <g fill="none" stroke="#87683b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Center Mandana Lotus / Ashtadal -->
    <circle cx="120" cy="120" r="14"/>
    <circle cx="120" cy="120" r="28" stroke-dasharray="3 4"/>
    <polygon points="120,80 148,108 148,132 120,160 92,132 92,108"/>
    <polygon points="80,120 108,92 132,92 160,120 132,148 108,148"/>

    <!-- Concentric geometric steps (Chowk) -->
    <rect x="50" y="50" width="140" height="140" transform="rotate(45 120 120)"/>
    <rect x="70" y="70" width="100" height="100"/>
    
    <!-- Floral corner petals -->
    <path d="M120,20 Q135,45 120,70 Q105,45 120,20 Z"/>
    <path d="M120,170 Q135,195 120,220 Q105,195 120,170 Z"/>
    <path d="M20,120 Q45,135 70,120 Q45,105 20,120 Z"/>
    <path d="M170,120 Q195,135 220,120 Q195,105 170,120 Z"/>

    <!-- Corner triangles and dots -->
    <circle cx="20" cy="20" r="4" fill="#87683b"/>
    <circle cx="220" cy="20" r="4" fill="#87683b"/>
    <circle cx="20" cy="220" r="4" fill="#87683b"/>
    <circle cx="220" cy="220" r="4" fill="#87683b"/>
    <path d="M0,0 L40,0 L0,40 Z"/>
    <path d="M240,0 L200,0 L240,40 Z"/>
    <path d="M0,240 L40,240 L0,200 Z"/>
    <path d="M240,240 L200,240 L240,200 Z"/>
  </g>
</svg>
